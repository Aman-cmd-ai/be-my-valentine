<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Eri ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap');
        
        body { 
            background: linear-gradient(135deg, #fce4ec 0%, #ffebee 100%);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        .romantic-text { font-family: 'Dancing Script', cursive; }

        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.4);
            animation: float 6s infinite linear;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .pulse-btn { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 77, 109, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen relative">

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="heart-container"></div>

    <div id="container" class="z-10 bg-white/90 backdrop-blur-md p-8 rounded-[40px] shadow-2xl text-center max-w-md mx-4 border-2 border-pink-200">
        
        <div id="intro-view">
            <h1 class="romantic-text text-5xl text-pink-600 mb-6">Hi Eri...</h1>
            <p class="text-gray-600 text-lg mb-8 leading-relaxed">
                Distance is just a test to see how far love can travel. I made this to let you know I'm thinking of you.
            </p>
            <button onclick="startProposal()" class="bg-pink-500 text-white px-8 py-3 rounded-full font-bold hover:bg-pink-600 transition-all shadow-lg hover:scale-105">
                I have a question ❤️
            </button>
        </div>

        <div id="proposal-view" class="hidden">
            <img id="mainGif" class="h-[180px] mx-auto rounded-2xl mb-6 shadow-sm" 
                 src="https://gifdb.com/images/high/cute-love-bear-roses-ou7zho5oosxnpo6k.gif">
            <h1 class="romantic-text text-4xl mb-8 text-pink-600 font-bold px-2">Will you be my Valentine, Eri?</h1>
            
            <div class="flex flex-wrap justify-center items-center gap-6 min-h-[120px] relative">
                <button id="yesBtn" class="bg-pink-500 text-white font-bold py-3 px-10 rounded-full transition-all pulse-btn shadow-xl z-20">
                    YES!
                </button>
                <button id="noBtn" class="bg-gray-400 text-white font-bold py-2 px-6 rounded-full transition-all z-20">
                    No
                </button>
            </div>
        </div>

        <div id="success-view" class="hidden">
            <img class="mx-auto rounded-2xl mb-6 h-[180px]" src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif">
            <h1 class="romantic-text text-5xl text-pink-600 mb-4 font-bold">Yay!!! ❤️</h1>
            <div class="bg-pink-50 p-6 rounded-3xl border border-pink-100 mt-2">
                <p class="text-pink-700 text-lg italic leading-relaxed font-medium">
                    "Eri, I promise I will always do my best to keep you happy, no matter the distance between us."
                </p>
            </div>
            <p class="text-pink-400 text-xs mt-4 uppercase tracking-widest">You're my forever Valentine</p>
        </div>
    </div>

    <script>
        function createHeart() {
            const container = document.getElementById('heart-container');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = ['❤️', '💖', '🌸', '✨', '☁️'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 4) + 's';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 400);

        function startProposal() {
            document.getElementById('intro-view').classList.add('hidden');
            document.getElementById('proposal-view').classList.remove('hidden');
            
            // Play the music.mp3 file
            const music = document.getElementById('bgMusic');
            music.volume = 0.5;
            music.play().catch(e => console.log("Playback error:", e));
        }

        let noCount = 0;
        const phrases = [
            "No", "Eri, are you sure?", "Really sure??", "Think again!", "Last chance!", 
            "Surely not?", "You might regret this!", "Give it another thought!", 
            "Are you absolutely certain?", "Don't do this to me!", "Have a heart, Eri!", 
            "Don't be so cold!", "Change of heart?", "Reconsider? Please?", 
            "Is that your final answer?", "You're breaking my heart ;("
        ];

        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');

        noBtn.addEventListener('click', () => {
            noCount++;
            noBtn.innerText = phrases[Math.min(noCount, phrases.length - 1)];
            const newScale = 1 + (noCount * 0.35);
            yesBtn.style.transform = `scale(${newScale})`;
            
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${Math.max(10, x)}px`;
            noBtn.style.top = `${Math.max(10, y)}px`;
        });

        yesBtn.addEventListener('click', () => {
            document.getElementById('proposal-view').classList.add('hidden');
            document.getElementById('success-view').classList.remove('hidden');
            for(let i=0; i<60; i++) setTimeout(createHeart, i*30);
        });
    </script>
</body>
</html>
